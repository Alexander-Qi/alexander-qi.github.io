    Experience:
      - company: Tsinghua University (Jiao Group)
        position: Graduate Researcher
        location: Beijing, China
        start_date: 2022-08
        end_date: Present
        summary: "Investigating photochemical and radical reaction mechanisms via time-resolved spectroscopy, global kinetic modeling, and quantum chemical calculations."
        highlights:
          - "Investigating excited-state energy partitioning and bond-cleavage dynamics of visible-light free hydrogen atom generation via multi-wavelength fs/ns transient absorption, kinetic-constraint global modeling, and TD-DFT."
          - "Dissected the photophysics, energy-transfer catalysis, and degradation kinetics of modular pyridinium(boron) organic photocatalysts (J. Am. Chem. Soc. 2026)."
          - "Achieved the first direct observation and kinetic characterization of all open-shell intermediates in a photocatalytic cycle using U-PSD TREPR (J. Am. Chem. Soc. 2024)."
          - "Established a quantitative reactivity scale for α-aminoalkyl radicals in halogen atom transfer (XAT) reactions, revising literature rate constants by 3–5 orders of magnitude (J. Am. Chem. Soc. 2024)."
          - "Characterized transient enamine radical intermediates in photoredox/chiral primary amine synergistic catalysis via U-PSD TREPR (CCS Chem. 2024)."
      - company: "Lindau Nobel Laureate Meetings"
        position: "Young Scientist Nominee (Global Selection)"
        location: "Lindau, Germany"
        start_date: 2025-06
        end_date: 2025-07
        summary: "Selected as one of only 30 Chinese PhD students (600 globally) to engage in in-depth scientific exchange with Nobel Laureates."
        highlights:
          - "Engaged in cross-disciplinary dialogues focusing on the future of sustainable chemistry and quantum catalysis."
          - "Presented doctoral research on transient intermediates and EPR spectroscopy to a global audience of peers and Laureates."
          - "Established international academic networks with leading researchers in the fields of photochemistry and radical chemistry."

